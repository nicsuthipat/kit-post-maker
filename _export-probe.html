<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>export probe</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="ds/styles.css">
<link rel="stylesheet" href="ds/social/social.css">
<style>html,body{margin:0;background:#888}#out img{display:block;position:absolute;left:0;top:0}</style>
</head>
<body>
<div id="out"></div>
<script src="ds/social/variants.js"></script>
<script src="vendor/modern-screenshot.js"></script>
<script type="module">
import { renderBoard, groundById } from './render.js';
const u = new URL(location.href);
const dec = (s) => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));
const post = dec(u.searchParams.get('d'));
const GROUND = groundById(post.ground).bg;

const off = document.createElement('div');
off.style.cssText = 'position:fixed;left:-99999px;top:0';
const { board, w, h } = renderBoard(post, { scale: 1, guides: false });
off.append(board);
document.body.append(off);

try {
  await document.fonts.ready;
  await new Promise(r => setTimeout(r, 150));
  const dataUrl = await modernScreenshot.domToPng(board, { width:w, height:h, scale:1, backgroundColor:GROUND });
  off.remove();
  const img = new Image();
  img.onload = () => { document.title = 'ready:' + img.naturalWidth + 'x' + img.naturalHeight; };
  img.src = dataUrl;
  document.getElementById('out').append(img);
  document.body.style.width = w + 'px';
  document.body.style.height = h + 'px';
} catch (err) {
  document.title = 'ERROR';
  document.body.innerHTML = '<pre style="white-space:pre-wrap;color:#c00;font:14px monospace;padding:20px">EXPORT ERROR\n' +
    (err && err.stack || err && err.message || String(err)) + '</pre>';
}
</script>
</body>
</html>
